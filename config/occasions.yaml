# Occasions that repeat for every customer, not on fixed dates.
recurring:
  salary_days:
    days_of_month: [1, 5]       # payday window: 1st to 5th of each month
    theme: "payday treat"
  birthday:
    days_before: 3              # birthday offer can go out up to 3 days early
    theme: "happy birthday"
