# config/occasions.yaml — festival & occasion calendar. Edit freely, no coding needed.
#
# Each occasion:
#   name               what customers see in the message ("Happy Diwali!")
#   windows            date ranges (YYYY-MM-DD) when the occasion is "on"; add next year's dates here
#   demand_boost       how much more people shop in this window (1.0 = normal, 1.8 = 80% more)
#   boosted_categories categories people buy more of, and where festival offers should go
#   regions            optional: only customers in these regions (e.g. punjab) celebrate it
#   budget_multiplier  daily offer budget is multiplied by this during the window (still capped by rules.yaml)
#   target_segments    segments that should get festival offers (others get their normal offers)
#   theme / emoji      tone hint for the AI message writer
#
# NOTE: dates are best estimates — please double-check against an official calendar before demo day.

occasions:
  navratri:
    name: Navratri
    windows:
      - { start: 2025-09-22, end: 2025-10-01 }
      - { start: 2026-10-11, end: 2026-10-19 }
    demand_boost: 1.3
    boosted_categories: [fashion, beauty, footwear]
    budget_multiplier: 1.2
    target_segments: [lapsing, deal_hunter, new]
    theme: "9 nights, 9 looks — festive ethnic wear"
    emoji: "✨"

